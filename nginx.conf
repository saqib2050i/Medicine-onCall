# OnCall nginx: every request is authorised by the auth service (auth_request)
# before any file is served. Only the login page and auth endpoints are public,
# so fetching /manifest.json or /content/<id>.json directly returns 401 — not
# data. Auth is enforced here, in front of the static files, not in client JS.

# The auth service (auth/server.py) listens on loopback.
upstream oncall_auth { server 127.0.0.1:8081; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Authorise EVERY request by default (public routes below turn this off).
    auth_request /__auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;
    # Default handling for an unauthenticated request (a full-page navigation):
    # serve the login page IN PLACE with 200 — NOT a 302 redirect. Serving in
    # place means browsers that auto-upgrade redirected requests to HTTPS can't
    # break the logged-out experience, so the bare root URL "just works" and
    # shows the login page. Asset/API locations override this to @unauth401.
    error_page 401 = @login_page;

    include /etc/nginx/snippets/security-headers.conf;

    # --- internal auth subrequest ---------------------------------------
    location = /__auth {
        internal;
        auth_request off;
        proxy_pass http://oncall_auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Unauthenticated full-page navigation → serve the login page in place (200).
    # login.js captures the current path as the post-login redirect target.
    location @login_page {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-OnCall-Login "1" always;   # lets the service worker avoid caching login as the app shell
        default_type text/html;
        try_files /login.html =404;
    }

    # Unauthenticated API/asset request → a plain 401 the SPA detects and handles.
    location @unauth401 {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        return 401;
    }

    # --- public routes (no auth) ----------------------------------------
    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /favicon.ico {
        auth_request off;
        access_log off;
        return 204;
    }

    # Login page + its script are public (self-contained; not sensitive).
    location = /login {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/html;
        try_files /login.html =404;
    }
    location = /login.js {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Auth endpoints (login/logout/whoami) proxied to the auth service.
    location /auth/ {
        auth_request off;
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://oncall_auth;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- protected content (auth_request inherited from server) ----------
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        error_page 401 = @unauth401;
        try_files $uri =404;
    }
    location ~* \.(json|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        error_page 401 = @unauth401;
        try_files $uri =404;
    }
    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=86400";
        error_page 401 = @unauth401;
        try_files $uri =404;
    }

    # SPA fallback: clean URLs (/topic/x, /ingest, /category/y) serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
