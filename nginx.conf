server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Container healthcheck target
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Never let the service worker or generated content go stale in HTTP caches
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static assets: modest caching (the SW handles offline)
    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: clean URLs (/topic/x, /ingest, /category/y) serve the shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
