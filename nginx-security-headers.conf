# Security headers, included in every location. nginx does NOT merge
# server-level add_header into a location that sets its own add_header, so this
# snippet is included wherever headers are set to keep them consistent.
#
# CSP notes:
#   script-src 'self'      -> blocks ALL inline/injected JS, including <script>
#                             and on*= handlers inside a topic's `html` block.
#                             This is the main defence for the raw-HTML escape
#                             hatch. (All app JS is external files.)
#   style-src 'unsafe-inline' is allowed only for styles (login page uses an
#                             inline <style>; far lower risk than inline JS).
#   img-src data:          -> allows inline SVG / data-URI images in html blocks.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
