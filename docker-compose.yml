# Unraid / Dockge compose. Configuration comes from a .env file in this same
# directory (copy .env.example to .env and edit). Docker Compose substitutes
# ${VAR} values automatically; defaults after ":-" apply if a var is unset.
services:
  oncall-guide:
    image: ${IMAGE:-ghcr.io/owner/repo}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-oncall-guide}
    ports:
      - "${HOST_PORT:-8095}:80"           # NGINX Proxy Manager / Cloudflare Tunnel point here
    environment:
      # Signing key for session cookies. Optional: if left blank, a random key
      # is generated and persisted to the data volume (so sessions still survive
      # restarts). Set it to keep sessions stable across volume moves/replicas.
      # Generate with: openssl rand -base64 48
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-12}
      # Seed the first login user on first start (created only if missing, so
      # restarts never reset it). Leave blank to create users manually instead.
      - ONCALL_ADMIN_USER=${ONCALL_ADMIN_USER:-}
      - ONCALL_ADMIN_PASSWORD=${ONCALL_ADMIN_PASSWORD:-}
      # Set to "true" to serve ONLY mounted content (ignore the baked seeds).
      - ONCALL_DISABLE_SEEDS=${ONCALL_DISABLE_SEEDS:-false}
    volumes:
      # Optional — the image ships with seed content baked in. Drop extra
      # topic JSON files in CONTENT_DIR, then restart the container to index them.
      - ${CONTENT_DIR:-/mnt/user/appdata/oncall-guide/content}:/content:rw
      # Login users + the session signing key live here. KEEP THIS PERSISTENT
      # or everyone is logged out and all accounts are lost on redeploy.
      - ${DATA_DIR:-/mnt/user/appdata/oncall-guide/data}:/data:rw
    restart: ${RESTART_POLICY:-unless-stopped}

# First run — create your login user (no accounts exist until you do):
#   docker exec -it oncall-guide python3 /app/manage-users.py add <username>
