# Unraid / Dockge compose. Configuration comes from a .env file in this same
# directory (copy .env.example to .env and edit). Docker Compose substitutes
# ${VAR} values automatically; defaults after ":-" apply if a var is unset.
services:
  oncall-guide:
    image: ${IMAGE:-ghcr.io/owner/repo}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-oncall-guide}
    ports:
      - "${HOST_PORT:-8095}:80"           # NGINX Proxy Manager / Cloudflare Tunnel point here
    volumes:
      # Optional — the image ships with seed content baked in. Drop extra
      # topic JSON files in CONTENT_DIR, then restart the container to index them.
      - ${CONTENT_DIR:-/mnt/user/appdata/oncall-guide/content}:/content:rw
    environment:
      # Set to "true" to serve ONLY mounted content (ignore the baked seeds).
      - ONCALL_DISABLE_SEEDS=${ONCALL_DISABLE_SEEDS:-false}
    restart: ${RESTART_POLICY:-unless-stopped}
